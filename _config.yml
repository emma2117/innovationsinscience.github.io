# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Innovations in Science
email: community@innovationsinscience.com
description: >- # this means to ignore newlines until "baseurl:"
  Innovations in Science is a storytelling and community engagement platform designed to make science more visible, understandable, and locally relevant and developed from a collaboration between local newspapers and scientists.
baseurl: "/innovationsinscience.github.io" # the subpath of your site, e.g. /blog
url: "https://emma2117.github.io" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
# github_username:  jekyll

#nav bar 
header_pages:
  - _pages/about.md
  - _pages/team.html
  - _pages/columns.html
  
# Get pages to actually show up: 
include:
  - _pages
  - _columns
  - _pdfs
  - _images

#building collections of pages so they can be easily looped through every time one is added
collections:
  columns:
    output: true
    permalink: /:collection/:path/

#fonts
fonts:
  use_google_fonts: true # if true will use external google_fonts url below
  preconnect_urls:
    - https://fonts.gstatic.com
  google_fonts_url: "https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Oswald:wght@200..700&display=swap"
  use_self_hosted_fonts: false # font files must be placed in /assets/fonts folder and the @font-face definitions must be added to /assets/css/fonts.css
  heading: "Oswald"
  base: "EB-Garamond"

# These settings control how pages and collections are included in the site
defaults:
  # _columns
  - scope:
      path: ""
      type: columns
    values:
      layout: post

# Build settings
theme: minima
plugins:
 - jekyll-pdf-embed
 - jekyll-feed
# Exclude from processing.
